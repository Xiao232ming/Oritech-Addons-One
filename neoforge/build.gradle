plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    // 与 common 共用同一份访问转换器（common 在 vanilla 模式下已应用，这里让 NeoForge 侧也应用）
    accessTransformers.from project(':common').file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath
    version = "${neo_version}"

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 开发运行期专用依赖：不进产物，也不被依赖方继承
// （照抄 Oritech 的 localRuntime 写法）
configurations {
    localRuntime {
        canBeConsumed = false
        visible = false
    }

    named(sourceSets.main.runtimeClasspathConfigurationName) {
        extendsFrom(configurations.localRuntime)
    }
}

dependencies {
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Oritech 的 NeoForge 模块（Mojmap 发布物）
    compileOnly "rearth.oritech:oritech-neoforge-${minecraft_version}:${oritech_version}"

    localRuntime "rearth.oritech:oritech-neoforge-${minecraft_version}:${oritech_version}"
    localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    localRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    localRuntime "earth.terrarium.athena:athena-neoforge-1.21:${athena_version}"
    // 开发期可选：验证其它附属（Oritech Things）的分级插件能否被 I/III 型识别
    localRuntime "maven.modrinth:oritech-things:${oritechthings_version}"
}

// neoforge.mods.toml 由模板展开生成（沿用原来的做法）
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
