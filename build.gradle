plugins {
    id 'net.neoforged.moddev' version '2.0.146' apply false
    id 'fabric-loom' version '1.13-SNAPSHOT' apply false
}

// 所有项目（含根项目）
allprojects {
    apply plugin: 'java'

    base {
        // 归档名带模块名，例如 oritechaddonsone-fabric-1.2.1+mc1.21.1.jar
        archivesName = "${mod_id}-${project.name}"
    }

    version = "${mod_version}+mc${minecraft_version}"
    group = mod_group_id

    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

subprojects {
    apply plugin: 'maven-publish'

    dependencies {
        // AutoService：SPI 实现类的 META-INF/services 由注解处理器生成（照抄 Oritech 的接线）
        compileOnly "com.google.auto.service:auto-service:${auto_service_version}"
        annotationProcessor "com.google.auto.service:auto-service:${auto_service_version}"
    }

    repositories {
        mavenCentral()
        // Oritech 本体与其发布物（官方 README 指定的仓库）
        maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
        // ModMaven：镜像了很多常用 maven（Mixin、GrandPower 等）
        maven { url = 'https://modmaven.dev' }
        // CurseMaven：Oritech 的 POM 里引用了 curse.maven 坐标（例如 Jade），运行期解析需要它
        maven { url = 'https://beta.cursemaven.com' }
        // FTB：Oritech 也声明了这个（我们目前不依赖 FTB 的模组，但保持一致，以备 POM 传递引用）
        maven { url = 'https://maven.ftb.dev/releases' }
        // Architectury API、Team Reborn Energy
        maven { url = 'https://maven.architectury.dev/' }
        // Athena (CTM)
        maven { url = 'https://maven.teamresourceful.com/repository/maven-public/' }
        // Mod Menu / Terraformers
        maven { url = 'https://maven.terraformersmc.com/' }
        // Forge Config API Port
        maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
        maven { url = 'https://maven.su5ed.dev/releases' }
        // GeckoLib
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        // owo-lib
        maven { url = 'https://maven.wispforest.io/releases/' }
        // Parchment mappings
        maven { url = 'https://maven.parchmentmc.org' }
        // 仅开发期用（Oritech Things）
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
    }

    // 让模块可以用统一坐标被引用（照抄 Oritech 的 capability 写法）
    ['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
        configurations."$variant".outgoing {
            capability("$group:${base.archivesName.get()}:$version")
            capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
            capability("$group:$mod_id:$version")
        }
        publishing.publications.configureEach {
            suppressPomMetadataWarningsFor(variant)
        }
    }

    // 手写资源覆盖生成资源时靠这个（目录 artifact 合并用得到）
    tasks.withType(AbstractCopyTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
            maven { url = "file://${project.projectDir}/repo" }
        }
    }
}

// 仅 loader 项目：把 common 的源码与资源注入自己的编译/打包（照抄 Oritech 的核心机制）
subprojects {
    if (project.path == ':common') {
        return
    }

    configurations {
        commonJava { canBeResolved = true }
        commonResources { canBeResolved = true }
    }

    dependencies {
        compileOnly(project(':common')) {
            capabilities {
                requireCapability "$group:$mod_id"
            }
            transitive = false
        }
        commonJava project(path: ':common', configuration: 'commonJava')
        commonResources project(path: ':common', configuration: 'commonResources')
    }

    tasks {
        processResources {
            dependsOn(configurations.commonResources)
            from(configurations.commonResources)

            inputs.property 'version', project.version
            // fabric.mod.json 里的 ${version} 占位符在打包时展开
            filesMatching(['fabric.mod.json']) {
                expand version: version
            }
        }

        named('compileJava', JavaCompile) {
            dependsOn(configurations.commonJava)
            source(configurations.commonJava)
        }

        named('sourcesJar', Jar) {
            dependsOn(configurations.commonJava)
            from(configurations.commonJava)
            dependsOn(configurations.commonResources)
            from(configurations.commonResources)
        }
    }
}
