# Gradle
org.gradle.jvmargs=-Xmx1536M
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
# 三个模块混用 moddev + loom；关掉 configuration cache 更稳（Oritech 同一套接线也没开）
# org.gradle.configuration-cache=true

# Modrinth / BlameJared 等 maven 从某些网络很慢（Oritech jar 本身 ~10 MB），给下载留足时间
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

## Mod properties ##

mod_id=oritechaddonsone
mod_name=Oritech Addons One
mod_license=MIT
mod_version=1.2.2-beta
mod_group_id=io.github.xiao232ming.oritechaddonsone

## Minecraft / mappings ##

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# common 模块用 NeoForm vanilla 模式编译（无 loader），与 Oritech 自己的 common 完全一致
neoform_version=20240808.144430
# 编译瞄准 Oritech 自己声明的最低 NeoForge（它的 mods.toml 里是 [21.1.200,)）
neo_version=21.1.200
loader_version_range=[1,)

## Fabric（与 Oritech 1.21 分支 / 1.2.x 发布物保持一致）##

fabric_loader_version=0.17.3
fabric_api_version=0.116.7+1.21.1
modmenu_version=11.0.3

## 第三方依赖（版本与 Oritech 的 POM 对齐）##

architectury_version=13.0.11
geckolib_version=4.6.6
athena_version=4.0.0
forge_config_api_port_version=21.1.6
auto_service_version=1.1.1

## Oritech 本体 ##
# 官方发布物在 BlameJared maven（见 Oritech README 的 "Depending on Oritech"）：
#   rearth.oritech:oritech-common-1.21.1        (Mojmap，给 moddev vanilla 模式的 common 模块)
#   rearth.oritech:oritech-fabric-1.21.1        (intermediary，给 loom)
#   rearth.oritech:oritech-neoforge-1.21.1      (Mojmap)
oritech_version=1.2.12
# 仅 NeoForge 侧开发运行期使用（验证其它附属的分级插件能否被 I/III 型识别）
# Fabric 侧按需求不做 Oritech Things 兼容
oritechthings_version=vt3nmngK
