name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (MC 1.21.1 / NeoForge 21.1.250)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Oritech / Architectury / Athena / GeckoLib come from the Modrinth Maven, so no manual setup is needed.
      - name: Build
        run: ./gradlew build

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: oritechaddonsone-mc1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
