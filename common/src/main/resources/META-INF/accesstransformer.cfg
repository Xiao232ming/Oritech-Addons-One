# 本模组需要的访问转换器。moddev 在 vanilla 模式下也会应用它（common 就是在 vanilla 模式下编译的），
# 所以这些在 vanilla 里不可见的成员可以在 common 里直接使用；NeoForge 侧由 neoforge/build.gradle 显式引用同一份文件。
#
# BlockEntityType.Builder.of(...) 的参数类型在 vanilla 里是包私有的（NeoForge 用 AT 放开），
# 我们要在 common 里调用它，所以照抄 Oritech 的做法把它放开。
#
# 注意：客户端成员（例如 AbstractContainerScreen 的 leftPos/topPos）**故意不在这里放开** ——
# 专用服务器上客户端类会被 runtimedistcleaner 剥掉，全局放开有风险；
# 那两个字段改由客户端 mixin 里的 @Accessor 读取（见 mixin/ContainerScreenAccessor.java）。
public net.minecraft.world.level.block.entity.BlockEntityType$BlockEntitySupplier
